
name: Generate STARFRONT Asset Index

on:
  push:
    branches:
      - version2-r1
    paths:
      - 'starfront-world-assets/images/pilots/**/*.webp'
      - 'starfront-world-assets/images/pilots/**/gallery.json'
      - 'starfront-world-assets/images/pilots/manifest.json'
      - 'starfront-world-assets/scripts/generate-asset-index.mjs'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate index
        working-directory: starfront-world-assets
        run: node scripts/generate-asset-index.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add starfront-world-assets/images/pilots/*/files.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): regenerate pilot indexes"
            git push
          fi
